services:
  - type: web
    name: gwen-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEFAULT_PROVIDER
        value: ollama
      - key: CORS_ORIGINS
        value: '["*"]'
    disk:
      name: gwen-storage
      mountPath: /app/storage
      sizeGB: 1
